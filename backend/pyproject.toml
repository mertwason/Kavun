[project]
name = "kavun-backend"
version = "0.1.0"
description = "Kavun — pazaryeri kârlılık ve mutabakat platformu (API + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.2",
    "structlog>=24.4",
    "cryptography>=43.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-python-dateutil",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",
    "SIM",
    "TID",
    "RUF",
]
ignore = [
    "E501",   # satır uzunluğu formatter'a bırakılır
    "RUF001", # Türkçe metinlerdeki ı/ş/ğ "belirsiz karakter" sayılmaz
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# FastAPI'nin `Depends(...)` varsayılan-argüman kalıbı zorunlu.
"app/api/*" = ["B008"]

[tool.ruff.lint.isort]
# `alembic/` dizini var diye alembic paketi first-party sanılmasın.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery'nin @task dekoratörü tipsizdir; kural yalnızca bu modülde gevşetilir.
module = ["app.workers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
