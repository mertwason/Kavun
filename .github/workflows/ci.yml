name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kavun
          POSTGRES_PASSWORD: kavun
          POSTGRES_DB: kavun_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kavun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: ci
      DATABASE_URL: postgresql+psycopg://kavun:kavun@localhost:5432/kavun_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Bağımlılıklar
        run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format)
        run: ruff format --check .

      - name: Para/float kuralı (CLAUDE.md §1)
        run: python -m tools.check_money_float app

      - name: mypy --strict
        run: mypy app tools tests

      - name: pytest + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Coverage raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (tsc · eslint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  compose:
    name: docker compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env hazırla
        run: cp .env.example .env

      - name: Ortamı ayağa kaldır
        run: docker compose up -d --build

      - name: API sağlık kontrolü
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs --tail=100
          exit 1

      - name: Migration'lar uygulanır
        run: docker compose exec -T api alembic upgrade head

      - name: Demo veri yüklenir
        run: docker compose exec -T api python -m app.cli seed-demo

      - name: Frontend erişilebilir mi
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null; then echo "frontend ok"; exit 0; fi
            sleep 2
          done
          docker compose logs --tail=100 frontend
          exit 1

      - name: Ortamı kapat
        if: always()
        run: docker compose down -v
